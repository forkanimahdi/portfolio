<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-WHDR8PG5F9');

      window.addEventListener('load', function () {
        setTimeout(function () {
          var script = document.createElement('script');
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-WHDR8PG5F9';
          script.async = true;
          document.head.appendChild(script);
        }, 1500);
      });
    </script>

    <!-- Per-route title, description, canonical, Open Graph, Twitter and JSON-LD.
         Replaced at build time by scripts/prerender.js (data lives in src/seo). -->
    <!-- seo:start -->
    <title>Mehdi Forkani | Freelance Mobile &amp; Web App Developer in Casablanca</title>
    <meta name="description" content="Freelance mobile and web app developer in Casablanca, Morocco. I build web platforms, mobile apps, backends and dashboards with Laravel, React and React Native." />
    <!-- seo:end -->
    <meta name="author" content="Mehdi Forkani" />
    <meta name="theme-color" content="#0c0c0c" />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      />
      <!-- Without JavaScript, entrance animations never run: show their content as-is. -->
      <style>
        #root [style*="opacity:0"] { opacity: 1 !important; transform: none !important; filter: none !important; }
      </style>
    </noscript>

    <script>
      if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light");
    </script>
    <!-- Instant dark paint so humans never see a white flash -->
    <style>
      html, body {
        margin: 0;
        background: #0c0c0c;
        color: #fff;
      }
      #root:empty {
        min-height: 100vh;
        background: #0c0c0c;
      }
      html.light, html.light body, html.light #root:empty {
        background: #ffffff;
        color: #0c0c0c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
