<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-WHDR8PG5F9');

      // Analytics waits for the first interaction or an idle moment after load, so it never competes with the first paint or hydration.
      (function () {
        var loaded = false;
        var events = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) { removeEventListener(e, loadGtag); });
          var script = document.createElement('script');
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-WHDR8PG5F9';
          script.async = true;
          document.head.appendChild(script);
        }
        events.forEach(function (e) { addEventListener(e, loadGtag, { once: true, passive: true }); });
        addEventListener('load', function () {
          setTimeout(function () {
            (window.requestIdleCallback || setTimeout)(loadGtag);
          }, 3500);
        });
      })();
    </script>

    <!-- Per-route title, description, canonical, Open Graph, Twitter and JSON-LD.
         Replaced at build time by scripts/prerender.js (data lives in src/seo). -->
    <!-- seo:start -->
    <title>Mehdi Forkani | Freelance Mobile &amp; Web App Developer in Casablanca, Morocco</title>
    <meta name="description" content="Freelance web developer and mobile app developer in Casablanca: websites, web apps and iOS and Android apps for businesses across Morocco, with SEO and GEO built in. Also a full-stack web development coach." />
    <!-- seo:end -->
    <meta name="author" content="Mehdi Forkani" />
    <meta name="theme-color" content="#0c0c0c" />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <noscript>
      <!-- Without JavaScript, entrance animations never run: show their content as-is. -->
      <style>
        #root [style*="opacity:0"] { opacity: 1 !important; transform: none !important; filter: none !important; }
      </style>
    </noscript>

    <script>
      if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light");
    </script>
    <!-- Instant dark paint so humans never see a white flash -->
    <style>
      html, body {
        margin: 0;
        background: #0c0c0c;
        color: #fff;
      }
      #root:empty {
        min-height: 100vh;
        background: #0c0c0c;
      }
      html.light, html.light body, html.light #root:empty {
        background: #ffffff;
        color: #0c0c0c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
